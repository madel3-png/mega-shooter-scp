workflows:
  ios-workflow:
    name: Build iPhone IPA
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Generate iOS files
        script: flutter create . --platforms=ios
      - name: Build iOS App
        script: flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r MegaShooterSCP.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
