workflows:
  ios-workflow:
    name: Build iPhone IPA
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Generate iOS files
        script: flutter create . --platforms=ios
      - name: Prepare Flutter iOS build
        script: flutter build ios --config-only --release --no-codesign
      - name: Build Unsigned Runner.app
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/Build/Products/Release-iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r MegaShooterSCP.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
